<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — AetherShare</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
  :root {
    --primary-red: #dc3545;
    --dark-red: #a71d2a;
    --light-pink: #fff5f5;
    --border-pink: #fed7d7;
  }

  body {
    min-height: 100vh;
    background-color: #fafbfc;
    color: #2d3748;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .app-header {
    background: linear-gradient(135deg, var(--dark-red), var(--primary-red));
    color: white;
    padding: 2rem 1rem;
    box-shadow: 0 4px 12px rgba(220, 53, 69, 0.15);
  }

  .login-card {
    width: 100%;
    max-width: 440px;
    background: white;
    border: 1px solid var(--border-pink);
    border-radius: 12px;
    box-shadow: 0 4px 6px -1px rgba(220, 53, 69, 0.05), 0 2px 4px -1px rgba(220, 53, 69, 0.03);
  }

  .form-control:focus {
    border-color: var(--primary-red);
    box-shadow: 0 0 0 0.25rem rgba(220, 53, 69, 0.25);
  }

  .btn-danger {
    background-color: var(--primary-red);
    border-color: var(--primary-red);
  }

  .btn-danger:hover {
    background-color: var(--dark-red);
    border-color: var(--dark-red);
  }

  .back-link {
    color: var(--dark-red);
    text-decoration: none;
  }

  .back-link:hover {
    color: var(--primary-red);
    text-decoration: underline;
  }
</style>
</head>
<body class="d-flex flex-column">
<header class="app-header text-center">
  <div class="container">
    <h1 class="display-5 fw-bold mb-1">AetherShare</h1>
    <p class="lead mb-0 opacity-75">Visual cryptography document storage (demo)</p>
  </div>
</header>

<main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
  <section class="login-card p-4 p-md-5" aria-labelledby="login-title">
    <h2 id="login-title" class="h4 fw-bold text-danger mb-2">Welcome back</h2>
    <p class="text-muted mb-4">Sign in to continue to your secure document locker.</p>

    <form id="login-form">
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email address</label>
        <input id="email" name="email" type="email" class="form-control" placeholder="you@example.com" autocomplete="username" required>
      </div>
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Password</label>
        <input id="password" name="password" type="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
      </div>
      <div class="form-check mb-4">
        <input id="remember" name="remember" type="checkbox" class="form-check-input">
        <label for="remember" class="form-check-label">Remember me</label>
      </div>
      <button type="submit" class="btn btn-danger w-100 py-2 fw-semibold">Sign in</button>
      <p id="login-message" class="small text-danger mt-3 mb-0" role="status" hidden></p>
    </form>

    <p class="small text-muted text-center mt-4 mb-0">
      Authentication is not configured in this demo.
      <a class="back-link fw-semibold" href="/app">Continue to the demo</a>
    </p>
  </section>
</main>

<script>
document.getElementById("login-form").addEventListener("submit", (event) => {
  event.preventDefault();
  const message = document.getElementById("login-message");
  message.textContent = "Sign-in is a preview only; this demo does not verify accounts.";
  message.hidden = false;
});
</script>
</body>
</html>
